{% extends "base.html" %}

<!-- SELECTEUR DE MOIS -->
{% block selecteur %}
<select id="select-mois" name="mois" hx-trigger="change" hx-get="/saints" hx-target="body" hx-push-url="true">
    {% for m, name in [
        ('01','Janvier'),('02','Février'),('03','Mars'),
        ('04','Avril'),('05','Mai'),('06','Juin'),
        ('07','Juillet'),('08','Août'),('09','Septembre'),
        ('10','Octobre'),('11','Novembre'),('12','Décembre')
        ] %}
        <option value="{{ m }}" {{ 'selected' if mois==m else '' }}>
            {{ name }}
        </option>
    {% endfor %}
</select>
{% endblock %}


{% block content %}
<style>
    #saints-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 20px;
    }

    .saint-card {
        position: relative;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
        display: flex;
        flex-direction: column;
    }

    .saint-image {
        width: 100%;
        background: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .saint-image img {
        max-width: 100%;
        max-height: 100%;
        object-fit: fill;
    }

    .saint-content {
        position: absolute; /* Positionnement absolu par rapport à la div parent */
        bottom: 10%;           /* Centre verticalement */
        left: 0%;          /* Centre horizontalement */
        color: white;       /* Couleur du texte */
        text-shadow: 2px 2px 4px rgba(0,0,0,0.7); /* Ombre pour le contraste */
    }

    .saint-name {
        margin: 0;
        font-size: 1.3rem;
        font-weight: bold;
    }

    .saint-title {
        margin: 5px 0 10px;
        font-size: 1rem;
        color: #666;
    }

    .saint-description {
        margin: 0;
        line-height: 1.4;
        white-space: pre-wrap;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        /* nombre de lignes */
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
</style>

<!-- AFFICHAGE DES SAINTS DU MOIS -->
<div id="saints-container" hx-get="/vue/mois" hx-trigger="load" hx-include="[name='mois']">
</div>

{% endblock %}
