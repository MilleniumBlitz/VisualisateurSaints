<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Saints</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/reset.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/main.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static',filename='styles/layouts.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="side left">
        <div class="logo"><p hx-trigger="" hx-get="/" hx-target="body" hx-push-url="true">Saint du jour</p></div>
      </div>
      <div class="center">
        {% block selecteur %}{% endblock %}
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    
  </body>
</html>
