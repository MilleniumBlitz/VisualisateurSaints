{% extends "base.html" %} {% block content %}

<style>
.saint-edit {
  display: grid;
  grid-template-columns: 40% 60%;
  gap: 2rem;
}

</style>

<h2>Modifier : {{ saint['nom'] }}</h2>

<form method="POST" enctype="multipart/form-data">
<div class="saint-edit">
  <div class="image-panel">
    <img id="preview" src="/static/{{ saint['image'] }}" alt="Photo du saint" />
    <label class="upload-btn">
      <p id="filename"></p>
      <input type="file" id="image" name="image" accept="image/*" />
    </label>
  </div>

  <div class="form-panel">
    <label>Jour :</label><br />
      <input type="text" name="jour" value="{{ saint['jour'] }}" /><br /><br />

      <label>Mois :</label><br />
      <input type="text" name="mois" value="{{ saint['mois'] }}" /><br /><br />

      <label>Nom :</label><br />
      <input type="text" name="nom" value="{{ saint['nom'] }}" /><br /><br />

      <label>Titre :</label><br />
      <input
        type="text"
        name="titre"
        value="{{ saint['titre'] }}"
      /><br /><br />

      <label>Date de naissance :</label><br />
      <input
        type="text"
        name="date_naissance"
        value="{{ saint['date_naissance'] }}"
      /><br /><br />
      d
      <label>Description :</label><br />
      <textarea name="description" rows="10" cols="80">
{{ saint['description'] }}</textarea
      ><br /><br />

      <label>Source :</label><br />
      <textarea name="source" rows="10" cols="80">
{{ saint['source'] }}</textarea
      ><br /><br />
      
      <button type="submit">Enregistrer</button>
    </div>
  </div>
</div>

</form>

<script>
  document.getElementById("image").addEventListener("change", function (event) {
    const file = event.target.files[0];

    if (file) {
      // Afficher le nom
      document.getElementById("filename").textContent =
        "Fichier choisi : " + file.name;

      // Afficher l’aperçu
      const preview = document.getElementById("preview");
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    }
  });
</script>

{% endblock %}
